<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Contador regressivo personalizável." />
    <title>Countdown</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./countdown.js" defer></script>
  </head>
  <body>
    <main id="app" class="app">
      <section class="content" aria-labelledby="title">
        <p class="eyebrow">Um momento especial está chegando</p>
        <h1 id="title">Formatura em...</h1>
        <div class="countdown" aria-label="Contagem regressiva">
          <div class="unit"><strong id="days">0</strong><span>Dias</span></div>
          <div class="unit"><strong id="hours">00</strong><span>Horas</span></div>
          <div class="unit"><strong id="minutes">00</strong><span>Minutos</span></div>
          <div class="unit"><strong id="seconds">00</strong><span>Segundos</span></div>
        </div>
      </section>
      <img class="icon" src="../../assets/icon.png" alt="" />
    </main>
  </body>
</html>
